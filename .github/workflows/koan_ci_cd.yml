name: "koan: CI/CD"
# The gpui-koan crates, as radiosilence/koan's ci-cd.yml does its own: every
# push and pull request to `koan` is checked; `Checks` gates CD; a push
# releases only when it changes the version (script/koan/VERSION) to one not
# yet released. The crates are staged from this branch by
# script/koan/publish-gpui-koan.ts, published with koan's steps, and the
# release (and its tag, `gpui-koan-v<version>`) is made by CI.
#
# Configuration:
#   secrets.CARGO_REGISTRY_TOKEN  crates.io token, publish scope for gpui-koan*;
#                                 until it is set nothing is released
#   secrets.KOAN_TOKEN            pull requests on radiosilence/koan
#
# Once radiosilence/koan builds on gpui-koan, every run also builds and tests
# it against the staged crates, and a release opens a koan pull request
# moving its pins; until then both say so and pass.
on:
  push:
    branches: [koan]
  pull_request:
    branches: [koan]
  workflow_dispatch:

# A manual run (a release, or its retry after crates.io's rate limit) and the
# runs pushes start queue apart: in one group, retrying a release cancelled
# a push's checks still waiting for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'release' || 'checks' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KOAN: radiosilence/koan
  GPUI_KOAN_WORK: ${{ github.workspace }}/target/gpui-koan

jobs:
  changes:
    name: Changes
    if: github.repository == 'radiosilence/zed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      apple: ${{ steps.apple.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: script/koan
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PUBLISHING: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          set -euo pipefail
          # As koan's: a push releases when it changes the version and that
          # version is not out yet; a manual run, which is how a failed
          # release is retried, releases whatever version is not out yet.
          version=$(cat script/koan/VERSION)
          bumped=false
          if [ "$(git show HEAD^1:script/koan/VERSION 2>/dev/null)" != "$version" ]; then
            bumped=true
          fi
          release=false
          if [ "$EVENT" = pull_request ]; then
            release=$bumped
          elif [ "$GITHUB_REF" = refs/heads/koan ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
            # Only a 404 means the version is not out. Any other failure
            # stops the run: guessing either way releases twice or never.
            if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/gpui-koan-v$version" 2>&1); then
              if printf '%s' "$out" | grep -q 'HTTP 404'; then
                release=true
              else
                echo "::error::cannot tell whether gpui-koan $version is released: $out"
                exit 1
              fi
            fi
          fi
          if [ "$release" = true ] && [ "$EVENT" != pull_request ] && [ "$PUBLISHING" != true ]; then
            echo "::notice::gpui-koan $version would be released, but CARGO_REGISTRY_TOKEN is not set"
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Apple backend touched
        id: apple
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The macOS backend and its Metal shaders build only on macOS, so
          # the macOS job runs when they, or the crates they build on,
          # change; a manual run checks them regardless.
          apple=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" HEAD | grep -qE '^(crates/gpui(_apple|_macos|_ios)?/|Cargo\.(toml|lock)$)'; then
              apple=false
            fi
          fi
          echo "apple=$apple" >> "$GITHUB_OUTPUT"

  crates:
    name: Crates
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      # Toolchains the image ships and nothing here uses, for disk.
      - name: Make room
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - name: Install system deps
        run: ./script/linux
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/koan' }}
          shared-key: gpui-koan-linux
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2
      - name: Versions in step
        # A git dependency on this branch is held to the same requirement a
        # release is, so the renamed crates carry VERSION here too.
        run: bun script/koan/set-version.ts --check
      - name: Test gpui
        run: cargo test -p gpui-koan
      - name: Stage, audit and verify the crates
        # Stages the standalone workspace, audits its licences and runs
        # `cargo publish --workspace --dry-run`, which packages and builds
        # every crate as crates.io will receive it.
        run: bun script/koan/publish-gpui-koan.ts "$VERSION" --zed . --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-koan
          path: |
            ${{ env.GPUI_KOAN_WORK }}/workspace
            !${{ env.GPUI_KOAN_WORK }}/workspace/target
          include-hidden-files: true
          retention-days: 7

  macos:
    name: macOS backend
    needs: changes
    # The one thing Linux cannot do: build gpui_macos and gpui_apple, whose
    # build script compiles the Metal shaders with Xcode's metal compiler,
    # and run their tests against a Metal device.
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/koan' }}
          shared-key: gpui-koan-macos
          cache-on-failure: true
      - name: Test the macOS backend
        run: cargo test -p gpui-koan-macos -p gpui-koan-apple

  koan:
    name: koan
    needs: [changes, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      GH_TOKEN: ${{ secrets.KOAN_TOKEN || github.token }}
    steps:
      - name: Make room
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: script/koan
      - name: Builds on gpui-koan
        id: uses
        run: |
          gh repo clone "$KOAN" "$RUNNER_TEMP/koan" -- --depth 1
          if grep -rqs 'gpui-koan' "$RUNNER_TEMP"/koan/Cargo.toml "$RUNNER_TEMP"/koan/crates/*/Cargo.toml; then
            echo "uses=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::radiosilence/koan does not build on gpui-koan yet"
            echo "uses=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install koan's system deps
        if: steps.uses.outputs.uses == 'true'
        uses: radiosilence/koan/.github/actions/linux-deps@main
      - uses: actions/download-artifact@v4
        if: steps.uses.outputs.uses == 'true'
        with:
          name: gpui-koan
          path: ${{ env.GPUI_KOAN_WORK }}/workspace
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.uses.outputs.uses == 'true'
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@v2
        if: steps.uses.outputs.uses == 'true'
      - name: Build and test koan against the staged crates
        if: steps.uses.outputs.uses == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/koan"
          bun "$GITHUB_WORKSPACE/script/koan/point-koan.ts" --staged "$GPUI_KOAN_WORK/workspace" --version "$VERSION"
          cargo test -p koan-kit
          cargo test -p koan-gui --lib

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, crates, macos, koan]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # `koan` only, after `Checks`. Every job states the results it depends on
  # rather than relying on the default, which would skip it whenever any job
  # upstream was skipped.

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/koan' && github.event_name != 'pull_request' }}
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpui-koan
          path: workspace
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Version pins
        working-directory: workspace
        run: |
          # Every staged crate, and every requirement between them, carries
          # the version being released: a stale sibling pin would publish a
          # crate depending on the previous snapshot.
          BAD=$(cargo metadata --no-deps --format-version 1 | jq -r --arg v "$VERSION" '
            .packages[] as $p
            | (if ($p.version | split("+")[0]) != $v then "\($p.name) \($p.version)" else empty end),
              ($p.dependencies[]
               | select(.name | startswith("gpui-koan"))
               | select((.req | ltrimstr("=") | split("+")[0]) != $v)
               | "\($p.name) -> \(.name) \(.req)")')
          if [ -n "$BAD" ]; then
            echo "::error::staged versions out of step with ${VERSION}:"
            echo "$BAD"
            exit 1
          fi

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [changes, check-version]
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpui-koan
          path: workspace
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Publish crates
        working-directory: workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # koan's step. `cargo publish --workspace` resolves dependency order
        # itself and waits for each crate to appear in the index before
        # publishing its dependents. No verification build: `Crates` verified
        # this staged workspace already.
        #
        # Publishing is not idempotent: it errors on a version that already
        # exists. A release retried after a partial publish (crates.io limits
        # how many new crates arrive at once, so the first release may need a
        # retry), or after a downstream failure, would fail here, so each
        # crate already in the index at this version is excluded and only the
        # rest go out.
        run: |
          EXCLUDE=()
          PENDING=0
          for crate in $(cargo metadata --no-deps --format-version 1 \
                         | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" \
               | grep -q "\"vers\":\"${VERSION}+"; then
              echo "${crate} ${VERSION} is already on crates.io"
              EXCLUDE+=(--exclude "$crate")
            else
              PENDING=$((PENDING + 1))
            fi
          done
          if [ "$PENDING" -eq 0 ]; then
            echo "nothing to publish"
            exit 0
          fi
          cargo publish --workspace --no-verify --allow-dirty "${EXCLUDE[@]}"

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, publish-crate]
    if: ${{ !cancelled() && needs.publish-crate.result == 'success' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tag and release
        run: |
          gh release create "gpui-koan-v$VERSION" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "gpui-koan $VERSION" \
            --notes "gpui-koan $VERSION, from \`koan\` at $GITHUB_SHA: Zed's GPUI with koan's commits, on crates.io as gpui-koan-*."

  koan-pins:
    name: Move koan's pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      GH_TOKEN: ${{ secrets.KOAN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: script/koan
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Open the koan pull request
        run: |
          set -euo pipefail
          gh repo clone "$KOAN" "$RUNNER_TEMP/koan"
          cd "$RUNNER_TEMP/koan"
          if ! grep -rqs 'gpui-koan' Cargo.toml crates/*/Cargo.toml; then
            echo "::notice::radiosilence/koan does not build on gpui-koan yet; no pins to move"
            exit 0
          fi
          git config user.name "gpui-koan"
          git config user.email "gpui-koan@users.noreply.github.com"
          git checkout -b "gpui-koan-$VERSION"
          bun "$GITHUB_WORKSPACE/script/koan/point-koan.ts" --version "$VERSION"
          cargo update -p gpui-koan
          git commit -am "GPUI: gpui-koan $VERSION"
          git push origin "gpui-koan-$VERSION"
          gh pr create --title "GPUI: gpui-koan $VERSION" --label gpui \
            --body "gpui-koan $VERSION, released from radiosilence/zed at ${GITHUB_SHA}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/gpui-koan-v${VERSION}"
